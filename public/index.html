<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线项目预览</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      color: #333;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 10px 20px;
      background-color: #1e1e1e;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    footer {
      padding: 10px;
      text-align: center;
      background-color: #f5f5f5;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <code-editor style="width: 100%;"></code-editor>
  </div>
  <!-- 加载 Monaco Editor -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.34.0/min/vs/loader.js"></script>
  <script>
    require.config({
      paths: {
        'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.34.0/min/vs'
      }
    });
    window.MonacoEnvironment = {
      getWorkerUrl: function(workerId, label) {
        return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
          self.MonacoEnvironment = {
            baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.34.0/min/'
          };
          importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.34.0/min/vs/base/worker/workerMain.js');`
        )}`;
      }
    };
  </script>
</body>
</html>
