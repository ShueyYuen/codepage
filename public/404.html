<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 2rem;
      border-radius: 8px;
      background-color: white;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 5rem;
      margin: 0;
      color: #0e639c;
    }
    p {
      font-size: 1.2rem;
      margin: 1rem 0 2rem;
    }
    a {
      color: #0e639c;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border: 1px solid #0e639c;
      border-radius: 4px;
    }
    a:hover {
      background-color: #0e639c;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>抱歉，您请求的页面未找到</p>
    <a href="/">返回主页</a>
  </div>
</body>
</html>
